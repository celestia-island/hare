[package]
edition = "2021"
name = "kei-qemu-mps2"
# Kept equal to the root crate's version: this crate is not published, but the
# org-wide `celestia-devtools verify-versions` gate fails any member that drifts
# from the workspace baseline. A hardcoded value (rather than
# `version.workspace = true`) keeps `[workspace.package]` out of the manifest:
# `publish.yml` reads the released version straight from this repository's root
# `Cargo.toml`, and the gate treats the root manifest as the baseline source, so a
# second copy of the number there would not be cross-checked.
version = "0.1.1"
publish = false
# Member of the library's own workspace, rooted at the parent directory.
# This crate lives INSIDE the library workspace so that cloning the repo
# yields a complete, loadable workspace — the demo used to sit outside it
# used to sit outside it and referenced the library through a sibling path, which
# made the package impossible to extract on its own.
workspace = ".."

[dependencies]

# The hare bridge library — the parent directory of this crate.
hare = { path = "..", default-features = false, features = [
    "wire",
    "manifest",
    "hal",
] }

# Heap allocator for `alloc` (kei's wire protocol uses Vec<u8> for frames).

linked_list_allocator = "0.10"
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"
critical-section = "1"

[profile.release]
debug = 2
opt-level = 3
lto = false
panic = "abort"
