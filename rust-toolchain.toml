[toolchain]
# `hare` builds on STABLE Rust: it targets bare-metal MCUs
# (`thumbv7em-none-eabi`, `riscv32imc-unknown-none-elf`) and carries no
# OS-specific code.
#
# Declaring the toolchain here is what makes the crate self-contained: a
# consumer gets the right toolchain from the directory alone, with no
# environment variable and no sibling checkout.
channel = "stable"
components = ["rustfmt", "clippy"]
targets = [
    # ARM Cortex-M — the primary embassy target.
    "thumbv7em-none-eabi",
    # RISC-V — the secondary target.
    "riscv32imc-unknown-none-elf",
]
